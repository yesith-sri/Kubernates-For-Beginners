  <rect width="1000" height="132" rx="18" fill="url(#background)"/>
  <circle cx="27" cy="25" r="6" fill="#326ce5" filter="url(#glow)">
    <animate attributeName="opacity" values=".45;1;.45" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="42" y="30" fill="#d9e8ff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1">YOUR 41-DAY KUBERNETES JOURNEY</text>
  <text x="965" y="30" text-anchor="end" fill="#7db4ff" font-family="Segoe UI, Arial, sans-serif" font-size="12">KEEP LEARNING →</text>

  <g transform="translate(0 48)">
    <g>
      <use href="#track" x="0"/>
      <use href="#track" x="9840"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-9840 0" dur="82s" repeatCount="indefinite"/>
    </g>
  </g>

  <rect x="0" y="45" width="70" height="76" fill="url(#fade-left)"/>
  <rect x="930" y="45" width="70" height="76" fill="url(#fade-right)"/>
</svg>
