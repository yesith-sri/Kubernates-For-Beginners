      <g transform="translate(5280 0)"><rect width="222" height="68" rx="14" fill="url(#card)" stroke="#4f8fff"/><text x="16" y="27" fill="#7db4ff" font-size="13" font-weight="700">DAY 23</text><text x="16" y="51" fill="#fff" font-size="16" font-weight="600">SecurityContext</text></g>
      <g transform="translate(5520 0)"><rect width="222" height="68" rx="14" fill="url(#card)" stroke="#4f8fff"/><text x="16" y="27" fill="#7db4ff" font-size="13" font-weight="700">DAY 24</text><text x="16" y="51" fill="#fff" font-size="16" font-weight="600">ServiceAccounts</text></g>
      <g transform="translate(5760 0)"><rect width="222" height="68" rx="14" fill="url(#card)" stroke="#4f8fff"/><text x="16" y="27" fill="#7db4ff" font-size="13" font-weight="700">DAY 25</text><text x="16" y="51" fill="#fff" font-size="16" font-weight="600">RBAC</text></g>
      <g transform="translate(6000 0)"><rect width="222" height="68" rx="14" fill="url(#card)" stroke="#4f8fff"/><text x="16" y="27" fill="#7db4ff" font-size="13" font-weight="700">DAY 26</text><text x="16" y="51" fill="#fff" font-size="16" font-weight="600">NetworkPolicies</text></g>
      <g transform="translate(6240 0)"><rect width="222" height="68" rx="14" fill="url(#card)" stroke="#4f8fff"/><text x="16" y="27" fill="#7db4ff" font-size="13" font-weight="700">DAY 27</text><text x="16" y="51" fill="#fff" font-size="16" font-weight="600">Image Security</text></g>
      <g transform="translate(6480 0)"><rect width="222" height="68" rx="14" fill="url(#card)" stroke="#4f8fff"/><text x="16" y="27" fill="#7db4ff" font-size="13" font-weight="700">DAY 28</text><text x="16" y="51" fill="#fff" font-size="16" font-weight="600">Services</text></g>
      <g transform="translate(6720 0)"><rect width="222" height="68" rx="14" fill="url(#card)" stroke="#4f8fff"/><text x="16" y="27" fill="#7db4ff" font-size="13" font-weight="700">DAY 29</text><text x="16" y="51" fill="#fff" font-size="16" font-weight="600">Ingress</text></g>
      <g transform="translate(6960 0)"><rect width="222" height="68" rx="14" fill="url(#card)" stroke="#4f8fff"/><text x="16" y="27" fill="#7db4ff" font-size="13" font-weight="700">DAY 30</text><text x="16" y="51" fill="#fff" font-size="16" font-weight="600">Ingress Controllers</text></g>
      <g transform="translate(7200 0)"><rect width="222" height="68" rx="14" fill="url(#card)" stroke="#4f8fff"/><text x="16" y="27" fill="#7db4ff" font-size="13" font-weight="700">DAY 31</text><text x="16" y="51" fill="#fff" font-size="16" font-weight="600">Cluster DNS</text></g>
      <g transform="translate(7440 0)"><rect width="222" height="68" rx="14" fill="url(#card)" stroke="#4f8fff"/><text x="16" y="27" fill="#7db4ff" font-size="13" font-weight="700">DAY 32</text><text x="16" y="51" fill="#fff" font-size="16" font-weight="600">Health Probes</text></g>
      <g transform="translate(7680 0)"><rect width="222" height="68" rx="14" fill="url(#card)" stroke="#4f8fff"/><text x="16" y="27" fill="#7db4ff" font-size="13" font-weight="700">DAY 33</text><text x="16" y="51" fill="#fff" font-size="16" font-weight="600">Logs</text></g>
      <g transform="translate(7920 0)"><rect width="222" height="68" rx="14" fill="url(#card)" stroke="#4f8fff"/><text x="16" y="27" fill="#7db4ff" font-size="13" font-weight="700">DAY 34</text><text x="16" y="51" fill="#fff" font-size="16" font-weight="600">Debug Toolkit</text></g>
      <g transform="translate(8160 0)"><rect width="222" height="68" rx="14" fill="url(#card)" stroke="#4f8fff"/><text x="16" y="27" fill="#7db4ff" font-size="13" font-weight="700">DAY 35</text><text x="16" y="51" fill="#fff" font-size="16" font-weight="600">API Deprecations</text></g>
      <g transform="translate(8400 0)"><rect width="222" height="68" rx="14" fill="url(#card)" stroke="#4f8fff"/><text x="16" y="27" fill="#7db4ff" font-size="13" font-weight="700">DAY 36</text><text x="16" y="51" fill="#fff" font-size="16" font-weight="600">Pod Debugging</text></g>
      <g transform="translate(8640 0)"><rect width="222" height="68" rx="14" fill="url(#card)" stroke="#4f8fff"/><text x="16" y="27" fill="#7db4ff" font-size="13" font-weight="700">DAY 37</text><text x="16" y="51" fill="#fff" font-size="16" font-weight="600">Helm Basics</text></g>
      <g transform="translate(8880 0)"><rect width="222" height="68" rx="14" fill="url(#card)" stroke="#4f8fff"/><text x="16" y="27" fill="#7db4ff" font-size="13" font-weight="700">DAY 38</text><text x="16" y="51" fill="#fff" font-size="16" font-weight="600">Helm Upgrades</text></g>
      <g transform="translate(9120 0)"><rect width="222" height="68" rx="14" fill="url(#card)" stroke="#4f8fff"/><text x="16" y="27" fill="#7db4ff" font-size="13" font-weight="700">DAY 39</text><text x="16" y="51" fill="#fff" font-size="16" font-weight="600">StatefulSets</text></g>
      <g transform="translate(9360 0)"><rect width="222" height="68" rx="14" fill="url(#card)" stroke="#4f8fff"/><text x="16" y="27" fill="#7db4ff" font-size="13" font-weight="700">DAY 40</text><text x="16" y="51" fill="#fff" font-size="16" font-weight="600">DaemonSets</text></g>
      <g transform="translate(9600 0)"><rect width="222" height="68" rx="14" fill="url(#card)" stroke="#4f8fff"/><text x="16" y="27" fill="#7db4ff" font-size="13" font-weight="700">DAY 41</text><text x="16" y="51" fill="#fff" font-size="16" font-weight="600">HPA &amp; VPA</text></g>
    </g>
