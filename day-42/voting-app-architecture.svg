<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%" height="100%" style="background:#0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
    <marker id="arrowEmerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a855f7" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="720" fill="url(#bgGrad)" />

  <!-- Subtle Tech Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="200" y1="0" x2="200" y2="720" />
    <line x1="400" y1="0" x2="400" y2="720" />
    <line x1="600" y1="0" x2="600" y2="720" />
    <line x1="800" y1="0" x2="800" y2="720" />
    <line x1="1000" y1="0" x2="1000" y2="720" />
  </g>

  <!-- Title Header -->
  <text x="600" y="45" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="800" letter-spacing="1">
    ☸️ KODEKLOUD EXAMPLE-VOTING-APP ARCHITECTURE
  </text>
  <text x="600" y="75" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="500">
    Official Kubernetes Specification (Day 42 Capstone Project)
  </text>

  <!-- ==================== LEFT: USER ACCESS (VOTE) ==================== -->
  <g transform="translate(40, 200)">
    <rect x="0" y="0" width="130" height="90" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="65" y="38" text-anchor="middle" font-size="28">🗳️</text>
    <text x="65" y="65" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Voters</text>
    <text x="65" y="80" text-anchor="middle" fill="#94a3b8" font-size="11">Cast Votes (Cats/Dogs)</text>
  </g>

  <!-- Arrow: Voters to Voting Service -->
  <path d="M 170 245 L 240 245" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowCyan)" />
  <rect x="180" y="215" width="50" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="205" y="230" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="700">HTTP</text>

  <!-- ==================== STEP 4: VOTE APP ==================== -->
  <g transform="translate(250, 160)">
    <!-- Service Box (NodePort) -->
    <rect x="-10" y="-45" width="230" height="38" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
    <text x="105" y="-28" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="700">
      vote-service (NodePort: 31000)
    </text>
    <text x="105" y="-12" text-anchor="middle" fill="#c7d2fe" font-size="10">
      Port: 8080 ➔ TargetPort: 80
    </text>

    <!-- Pod Card -->
    <rect x="0" y="0" width="210" height="180" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
    <rect x="15" y="15" width="40" height="40" rx="8" fill="#0f172a" />
    <text x="35" y="42" text-anchor="middle" font-size="22">🐍</text>
    <text x="65" y="35" fill="#f8fafc" font-size="17" font-weight="800">vote</text>
    <text x="65" y="52" fill="#38bdf8" font-size="11" font-weight="600">Python Web App</text>

    <!-- Details -->
    <line x1="15" y1="70" x2="195" y2="70" stroke="#334155" stroke-width="1" />
    <text x="20" y="95" fill="#94a3b8" font-size="11">Image: <tspan fill="#f1f5f9" font-weight="600">...examplevotingapp_vote</tspan></text>
    <text x="20" y="118" fill="#94a3b8" font-size="11">ContainerPort: <tspan fill="#38bdf8" font-weight="700">80</tspan></text>
    <text x="20" y="141" fill="#94a3b8" font-size="11">Label: <tspan fill="#f1f5f9" font-weight="600">app: vote</tspan></text>
    <rect x="15" y="152" width="70" height="18" rx="4" fill="#0369a1" />
    <text x="50" y="165" text-anchor="middle" fill="#e0f2fe" font-size="10" font-weight="700">STEP 4</text>
  </g>

  <!-- Arrow: vote to Redis Service -->
  <path d="M 355 340 L 355 420" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowCyan)" />
  <rect x="290" y="365" width="130" height="26" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
  <text x="355" y="382" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700">TCP: redis:6379</text>

  <!-- ==================== STEP 1: REDIS ==================== -->
  <g transform="translate(250, 430)">
    <!-- Service Box (ClusterIP) -->
    <rect x="-10" y="-35" width="230" height="30" rx="6" fill="#450a0a" stroke="#f87171" stroke-width="1.5" />
    <text x="105" y="-15" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="700">
      redis-service (ClusterIP: 6379)
    </text>

    <!-- Pod Card -->
    <rect x="0" y="0" width="210" height="180" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="2.5" />
    <rect x="15" y="15" width="40" height="40" rx="8" fill="#0f172a" />
    <text x="35" y="42" text-anchor="middle" font-size="22">🟥</text>
    <text x="65" y="35" fill="#f8fafc" font-size="17" font-weight="800">redis</text>
    <text x="65" y="52" fill="#ef4444" font-size="11" font-weight="600">In-Memory Queue</text>

    <!-- Details -->
    <line x1="15" y1="70" x2="195" y2="70" stroke="#334155" stroke-width="1" />
    <text x="20" y="95" fill="#94a3b8" font-size="11">Image: <tspan fill="#f1f5f9" font-weight="600">redis:alpine</tspan></text>
    <text x="20" y="118" fill="#94a3b8" font-size="11">Volume: <tspan fill="#f1f5f9" font-weight="600">emptyDir (/data)</tspan></text>
    <text x="20" y="141" fill="#94a3b8" font-size="11">Port: <tspan fill="#ef4444" font-weight="700">6379</tspan></text>
    <rect x="15" y="152" width="70" height="18" rx="4" fill="#991b1b" />
    <text x="50" y="165" text-anchor="middle" fill="#fee2e2" font-size="10" font-weight="700">STEP 1</text>
  </g>

  <!-- Arrow: Redis to Worker -->
  <path d="M 460 515 L 530 515" stroke="#a855f7" stroke-width="3" marker-end="url(#arrowPurple)" />
  <rect x="470" y="485" width="50" height="22" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
  <text x="495" y="500" text-anchor="middle" fill="#a855f7" font-size="10" font-weight="700">PULL</text>

  <!-- ==================== STEP 3: WORKER ==================== -->
  <g transform="translate(540, 430)">
    <!-- Pod Card -->
    <rect x="0" y="0" width="180" height="180" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="2.5" />
    <rect x="15" y="15" width="40" height="40" rx="8" fill="#0f172a" />
    <text x="35" y="42" text-anchor="middle" font-size="22">⚙️</text>
    <text x="65" y="35" fill="#f8fafc" font-size="17" font-weight="800">worker</text>
    <text x="65" y="52" fill="#c084fc" font-size="11" font-weight="600">.NET Daemon</text>

    <!-- Details -->
    <line x1="15" y1="70" x2="165" y2="70" stroke="#334155" stroke-width="1" />
    <text x="20" y="95" fill="#94a3b8" font-size="11">Image: <tspan fill="#f1f5f9" font-weight="600">...worker</tspan></text>
    <text x="20" y="118" fill="#94a3b8" font-size="11">Service: <tspan fill="#f1f5f9" font-weight="600">None</tspan></text>
    <text x="20" y="141" fill="#c084fc" font-size="11" font-weight="600">Redis ➔ DB</text>
    <rect x="15" y="152" width="70" height="18" rx="4" fill="#6b21a8" />
    <text x="50" y="165" text-anchor="middle" fill="#f3e8ff" font-size="10" font-weight="700">STEP 3</text>
  </g>

  <!-- Arrow: Worker to DB -->
  <path d="M 720 515 L 775 515" stroke="#0ea5e9" stroke-width="3" marker-end="url(#arrowCyan)" />
  <rect x="725" y="485" width="45" height="22" rx="4" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
  <text x="747" y="500" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="700">WRITE</text>

  <!-- ==================== STEP 2: POSTGRESQL (DB) ==================== -->
  <g transform="translate(785, 430)">
    <!-- Service Box (ClusterIP) -->
    <rect x="-10" y="-35" width="230" height="30" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.5" />
    <text x="105" y="-15" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="700">
      db-service (ClusterIP: 5432)
    </text>

    <!-- Pod Card -->
    <rect x="0" y="0" width="210" height="180" rx="16" fill="#1e293b" stroke="#0ea5e9" stroke-width="2.5" />
    <rect x="15" y="15" width="40" height="40" rx="8" fill="#0f172a" />
    <text x="35" y="42" text-anchor="middle" font-size="22">🐘</text>
    <text x="65" y="35" fill="#f8fafc" font-size="17" font-weight="800">db</text>
    <text x="65" y="52" fill="#38bdf8" font-size="11" font-weight="600">PostgreSQL DB</text>

    <!-- Details -->
    <line x1="15" y1="70" x2="195" y2="70" stroke="#334155" stroke-width="1" />
    <text x="20" y="95" fill="#94a3b8" font-size="11">Image: <tspan fill="#f1f5f9" font-weight="600">postgres:15-alpine</tspan></text>
    <text x="20" y="118" fill="#94a3b8" font-size="11">Volume: <tspan fill="#f1f5f9" font-weight="600">emptyDir (/var/lib/..)</tspan></text>
    <text x="20" y="141" fill="#94a3b8" font-size="11">Port: <tspan fill="#38bdf8" font-weight="700">5432</tspan></text>
    <rect x="15" y="152" width="70" height="18" rx="4" fill="#0369a1" />
    <text x="50" y="165" text-anchor="middle" fill="#e0f2fe" font-size="10" font-weight="700">STEP 2</text>
  </g>

  <!-- Arrow: DB to Result App (READ) -->
  <path d="M 890 420 L 890 340" stroke="#10b981" stroke-width="3" marker-end="url(#arrowEmerald)" />
  <rect x="830" y="365" width="120" height="26" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="890" y="382" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">READ: db:5432</text>

  <!-- ==================== STEP 5: RESULT APP ==================== -->
  <g transform="translate(785, 160)">
    <!-- Service Box (NodePort) -->
    <rect x="-10" y="-45" width="230" height="38" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="105" y="-28" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">
      result-service (NodePort: 31001)
    </text>
    <text x="105" y="-12" text-anchor="middle" fill="#a7f3d0" font-size="10">
      Port: 8081 ➔ TargetPort: 80
    </text>

    <!-- Pod Card -->
    <rect x="0" y="0" width="210" height="180" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2.5" />
    <rect x="15" y="15" width="40" height="40" rx="8" fill="#0f172a" />
    <text x="35" y="42" text-anchor="middle" font-size="22">📊</text>
    <text x="65" y="35" fill="#f8fafc" font-size="17" font-weight="800">result</text>
    <text x="65" y="52" fill="#34d399" font-size="11" font-weight="600">Node.js Analytics UI</text>

    <!-- Details -->
    <line x1="15" y1="70" x2="195" y2="70" stroke="#334155" stroke-width="1" />
    <text x="20" y="95" fill="#94a3b8" font-size="11">Image: <tspan fill="#f1f5f9" font-weight="600">...examplevotingapp_result</tspan></text>
    <text x="20" y="118" fill="#94a3b8" font-size="11">ContainerPort: <tspan fill="#34d399" font-weight="700">80</tspan></text>
    <text x="20" y="141" fill="#94a3b8" font-size="11">Label: <tspan fill="#f1f5f9" font-weight="600">app: result</tspan></text>
    <rect x="15" y="152" width="70" height="18" rx="4" fill="#065f46" />
    <text x="50" y="165" text-anchor="middle" fill="#d1fae5" font-size="10" font-weight="700">STEP 5</text>
  </g>

  <!-- ==================== RIGHT: USER ACCESS (RESULTS) ==================== -->
  <g transform="translate(1040, 200)">
    <rect x="0" y="0" width="130" height="90" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2" />
    <text x="65" y="38" text-anchor="middle" font-size="28">📈</text>
    <text x="65" y="65" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Viewers</text>
    <text x="65" y="80" text-anchor="middle" fill="#94a3b8" font-size="11">Live Results Graph</text>
  </g>

  <!-- Arrow: Result App to Viewers -->
  <path d="M 995 245 L 1030 245" stroke="#34d399" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowEmerald)" />
  <rect x="980" y="215" width="45" height="22" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1" />
  <text x="1002" y="230" text-anchor="middle" fill="#34d399" font-size="10" font-weight="700">HTTP</text>

  <!-- Bottom Legend Bar -->
  <g transform="translate(120, 650)">
    <rect x="0" y="0" width="960" height="48" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="35" cy="24" r="7" fill="#818cf8" />
    <text x="50" y="28" fill="#cbd5e1" font-size="12" font-weight="600">NodePort (Port 31000: Vote / Port 31001: Result)</text>

    <circle cx="430" cy="24" r="7" fill="#f87171" />
    <text x="445" y="28" fill="#cbd5e1" font-size="12" font-weight="600">ClusterIP (redis:6379, db:5432)</text>

    <circle cx="720" cy="24" r="7" fill="#34d399" />
    <text x="735" y="28" fill="#cbd5e1" font-size="12" font-weight="600">TargetPort: 80 (Container)</text>

    <text x="900" y="28" fill="#38bdf8" font-size="12" font-weight="700">☸️ KodeKloud Spec</text>
  </g>
</svg>