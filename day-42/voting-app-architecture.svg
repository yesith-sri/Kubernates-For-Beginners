<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" style="background:#0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="k8sBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="pythonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="redisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="postgresGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
    <marker id="arrowEmerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a855f7" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="700" fill="url(#bgGrad)" />

  <!-- Subtle Tech Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="200" y1="0" x2="200" y2="700" />
    <line x1="400" y1="0" x2="400" y2="700" />
    <line x1="600" y1="0" x2="600" y2="700" />
    <line x1="800" y1="0" x2="800" y2="700" />
    <line x1="1000" y1="0" x2="1000" y2="700" />
  </g>

  <!-- Title Header -->
  <text x="600" y="55" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="800" letter-spacing="1">
    ☸️ KUBERNETES MICROSERVICES ARCHITECTURE
  </text>
  <text x="600" y="85" text-anchor="middle" fill="#94a3b8" font-size="16" font-weight="500">
    Capstone Real-World Project: Example Voting App (Day 42)
  </text>

  <!-- ==================== LEFT: USER ACCESS (VOTE) ==================== -->
  <g transform="translate(60, 200)">
    <!-- User Icon & Label -->
    <rect x="0" y="0" width="130" height="90" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="65" y="38" text-anchor="middle" fill="#38bdf8" font-size="28">👥</text>
    <text x="65" y="65" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Voters</text>
    <text x="65" y="80" text-anchor="middle" fill="#94a3b8" font-size="11">Web Browser</text>
  </g>

  <!-- Arrow: Voters to Voting Service -->
  <path d="M 190 245 L 260 245" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowCyan)" />
  <rect x="200" y="215" width="50" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="225" y="230" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="700">HTTP</text>

  <!-- ==================== POD 1: VOTING-APP ==================== -->
  <g transform="translate(270, 160)">
    <!-- Service Box (NodePort) -->
    <rect x="-10" y="-35" width="220" height="30" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
    <text x="100" y="-15" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="700">
      NodePort: 30004 ➔ Port 80
    </text>

    <!-- Pod Card -->
    <rect x="0" y="0" width="200" height="170" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
    <rect x="15" y="15" width="40" height="40" rx="8" fill="#0f172a" />
    <text x="35" y="42" text-anchor="middle" font-size="22">🐍</text>
    <text x="65" y="35" fill="#f8fafc" font-size="18" font-weight="800">voting-app</text>
    <text x="65" y="52" fill="#38bdf8" font-size="12" font-weight="600">Python (Flask)</text>

    <!-- Details -->
    <line x1="15" y1="70" x2="185" y2="70" stroke="#334155" stroke-width="1" />
    <text x="20" y="95" fill="#94a3b8" font-size="12">Type: <tspan fill="#f1f5f9" font-weight="600">Frontend UI</tspan></text>
    <text x="20" y="118" fill="#94a3b8" font-size="12">TargetPort: <tspan fill="#38bdf8" font-weight="700">80</tspan></text>
    <text x="20" y="141" fill="#94a3b8" font-size="12">Replicas: <tspan fill="#f1f5f9" font-weight="600">1</tspan></text>
    <rect x="15" y="148" width="60" height="15" rx="3" fill="#0369a1" />
    <text x="45" y="159" text-anchor="middle" fill="#e0f2fe" font-size="9" font-weight="700">POD</text>
  </g>

  <!-- Arrow: voting-app to Redis Service -->
  <path d="M 370 330 L 370 410" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowCyan)" />
  <rect x="305" y="355" width="130" height="26" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
  <text x="370" y="372" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700">TCP: redis:6379</text>

  <!-- ==================== POD 2: REDIS ==================== -->
  <g transform="translate(270, 420)">
    <!-- Service Box (ClusterIP) -->
    <rect x="-10" y="-30" width="220" height="26" rx="6" fill="#450a0a" stroke="#f87171" stroke-width="1.5" />
    <text x="100" y="-13" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="700">
      ClusterIP: redis (Port: 6379)
    </text>

    <!-- Pod Card -->
    <rect x="0" y="0" width="200" height="160" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="2.5" />
    <rect x="15" y="15" width="40" height="40" rx="8" fill="#0f172a" />
    <text x="35" y="42" text-anchor="middle" font-size="22">🟥</text>
    <text x="65" y="35" fill="#f8fafc" font-size="18" font-weight="800">redis</text>
    <text x="65" y="52" fill="#ef4444" font-size="12" font-weight="600">In-Memory Queue</text>

    <!-- Details -->
    <line x1="15" y1="70" x2="185" y2="70" stroke="#334155" stroke-width="1" />
    <text x="20" y="95" fill="#94a3b8" font-size="12">Type: <tspan fill="#f1f5f9" font-weight="600">Queue Buffer</tspan></text>
    <text x="20" y="118" fill="#94a3b8" font-size="12">Port: <tspan fill="#ef4444" font-weight="700">6379</tspan></text>
    <text x="20" y="141" fill="#94a3b8" font-size="12">Access: <tspan fill="#f87171" font-weight="600">Internal Only</tspan></text>
  </g>

  <!-- Arrow: Redis to Worker -->
  <path d="M 470 500 L 535 500" stroke="#a855f7" stroke-width="3" marker-end="url(#arrowPurple)" />
  <rect x="475" y="468" width="55" height="22" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
  <text x="502" y="483" text-anchor="middle" fill="#a855f7" font-size="10" font-weight="700">PULL</text>

  <!-- ==================== POD 3: WORKER ==================== -->
  <g transform="translate(545, 420)">
    <!-- Pod Card -->
    <rect x="0" y="0" width="170" height="160" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="2.5" />
    <rect x="15" y="15" width="40" height="40" rx="8" fill="#0f172a" />
    <text x="35" y="42" text-anchor="middle" font-size="22">⚙️</text>
    <text x="65" y="35" fill="#f8fafc" font-size="18" font-weight="800">worker</text>
    <text x="65" y="52" fill="#c084fc" font-size="12" font-weight="600">.NET / Java</text>

    <!-- Details -->
    <line x1="15" y1="70" x2="155" y2="70" stroke="#334155" stroke-width="1" />
    <text x="20" y="95" fill="#94a3b8" font-size="12">Type: <tspan fill="#f1f5f9" font-weight="600">Background</tspan></text>
    <text x="20" y="118" fill="#94a3b8" font-size="12">Service: <tspan fill="#f1f5f9" font-weight="600">None</tspan></text>
    <text x="20" y="141" fill="#c084fc" font-size="11" font-weight="600">Redis ➔ DB</text>
  </g>

  <!-- Arrow: Worker to Postgres -->
  <path d="M 715 500 L 775 500" stroke="#0ea5e9" stroke-width="3" marker-end="url(#arrowCyan)" />
  <rect x="720" y="468" width="55" height="22" rx="4" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
  <text x="747" y="483" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="700">WRITE</text>

  <!-- ==================== POD 4: POSTGRES ==================== -->
  <g transform="translate(785, 420)">
    <!-- Service Box (ClusterIP) -->
    <rect x="-10" y="-30" width="220" height="26" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.5" />
    <text x="100" y="-13" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="700">
      ClusterIP: db (Port: 5432)
    </text>

    <!-- Pod Card -->
    <rect x="0" y="0" width="200" height="160" rx="16" fill="#1e293b" stroke="#0ea5e9" stroke-width="2.5" />
    <rect x="15" y="15" width="40" height="40" rx="8" fill="#0f172a" />
    <text x="35" y="42" text-anchor="middle" font-size="22">🐘</text>
    <text x="65" y="35" fill="#f8fafc" font-size="18" font-weight="800">postgres</text>
    <text x="65" y="52" fill="#38bdf8" font-size="12" font-weight="600">PostgreSQL DB</text>

    <!-- Details -->
    <line x1="15" y1="70" x2="185" y2="70" stroke="#334155" stroke-width="1" />
    <text x="20" y="95" fill="#94a3b8" font-size="12">Type: <tspan fill="#f1f5f9" font-weight="600">Persistent DB</tspan></text>
    <text x="20" y="118" fill="#94a3b8" font-size="12">Port: <tspan fill="#38bdf8" font-weight="700">5432</tspan></text>
    <text x="20" y="141" fill="#94a3b8" font-size="12">CoreDNS Name: <tspan fill="#7dd3fc" font-weight="700">db</tspan></text>
  </g>

  <!-- Arrow: Postgres to Result App (READ) -->
  <path d="M 885 410 L 885 330" stroke="#10b981" stroke-width="3" marker-end="url(#arrowEmerald)" />
  <rect x="825" y="355" width="120" height="26" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="885" y="372" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">READ: db:5432</text>

  <!-- ==================== POD 5: RESULT-APP ==================== -->
  <g transform="translate(785, 160)">
    <!-- Service Box (NodePort) -->
    <rect x="-10" y="-35" width="220" height="30" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="100" y="-15" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">
      NodePort: 30005 ➔ Port 80
    </text>

    <!-- Pod Card -->
    <rect x="0" y="0" width="200" height="170" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2.5" />
    <rect x="15" y="15" width="40" height="40" rx="8" fill="#0f172a" />
    <text x="35" y="42" text-anchor="middle" font-size="22">🟢</text>
    <text x="65" y="35" fill="#f8fafc" font-size="18" font-weight="800">result-app</text>
    <text x="65" y="52" fill="#34d399" font-size="12" font-weight="600">Node.js (Analytics)</text>

    <!-- Details -->
    <line x1="15" y1="70" x2="185" y2="70" stroke="#334155" stroke-width="1" />
    <text x="20" y="95" fill="#94a3b8" font-size="12">Type: <tspan fill="#f1f5f9" font-weight="600">Results UI</tspan></text>
    <text x="20" y="118" fill="#94a3b8" font-size="12">TargetPort: <tspan fill="#34d399" font-weight="700">80</tspan></text>
    <text x="20" y="141" fill="#94a3b8" font-size="12">Replicas: <tspan fill="#f1f5f9" font-weight="600">1</tspan></text>
    <rect x="15" y="148" width="60" height="15" rx="3" fill="#065f46" />
    <text x="45" y="159" text-anchor="middle" fill="#d1fae5" font-size="9" font-weight="700">POD</text>
  </g>

  <!-- ==================== RIGHT: USER ACCESS (RESULTS) ==================== -->
  <g transform="translate(1040, 200)">
    <!-- User Icon & Label -->
    <rect x="0" y="0" width="130" height="90" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2" />
    <text x="65" y="38" text-anchor="middle" fill="#34d399" font-size="28">📊</text>
    <text x="65" y="65" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Viewers</text>
    <text x="65" y="80" text-anchor="middle" fill="#94a3b8" font-size="11">Live Results</text>
  </g>

  <!-- Arrow: Result App to Viewers -->
  <path d="M 985 245 L 1030 245" stroke="#34d399" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowEmerald)" />
  <rect x="985" y="215" width="45" height="22" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1" />
  <text x="1007" y="230" text-anchor="middle" fill="#34d399" font-size="10" font-weight="700">HTTP</text>

  <!-- Bottom Legend Bar -->
  <g transform="translate(150, 630)">
    <rect x="0" y="0" width="900" height="45" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <!-- Legend Items -->
    <circle cx="40" cy="22" r="7" fill="#818cf8" />
    <text x="55" y="26" fill="#cbd5e1" font-size="12" font-weight="600">NodePort (External Access)</text>

    <circle cx="280" cy="22" r="7" fill="#f87171" />
    <text x="295" y="26" fill="#cbd5e1" font-size="12" font-weight="600">ClusterIP (Internal Only)</text>

    <circle cx="500" cy="22" r="7" fill="#38bdf8" />
    <text x="515" y="26" fill="#cbd5e1" font-size="12" font-weight="600">TargetPort = Container Port 80</text>

    <text x="800" y="26" fill="#38bdf8" font-size="12" font-weight="700">☸️ Kubernetes Core</text>
  </g>
</svg>